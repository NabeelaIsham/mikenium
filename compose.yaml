x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 300
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: mikenium
      POSTGRES_USER: mikenium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikenium -d mikenium"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  app:
    build:
      context: .
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 200
    stop_grace_period: 20s
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://mikenium:${POSTGRES_PASSWORD}@db:5432/mikenium
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env.production}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env.production}
      SUPER_ADMIN_TOTP_SECRET: ${SUPER_ADMIN_TOTP_SECRET:?Set SUPER_ADMIN_TOTP_SECRET in .env.production}
      CLIENT_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env.production}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env.production}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:?Set CONTACT_TO_EMAIL in .env.production}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BACKUP_STORAGE_LIMIT_BYTES: ${BACKUP_STORAGE_LIMIT_BYTES:-5368709120}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-1073741824}
      CONTACT_RETENTION_DAYS: ${CONTACT_RETENTION_DAYS:-730}
      SECURITY_METADATA_RETENTION_DAYS: ${SECURITY_METADATA_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
      NEWSLETTER_RETENTION_DAYS: ${NEWSLETTER_RETENTION_DAYS:-365}
      BACKUP_OFFSITE_DIR: /mnt/offsite-backups
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?Set ALERT_WEBHOOK_URL in .env.production}
    volumes:
      - uploads_data:/opt/mikenium/server/uploads
      - backups_data:/opt/mikenium/server/backups
      - ${BACKUP_OFFSITE_PATH:?Set BACKUP_OFFSITE_PATH in .env.production}:/mnt/offsite-backups
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - frontend
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 20s
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
